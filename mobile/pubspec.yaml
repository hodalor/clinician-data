name: seu_mobile
description: Android-first Flutter client scaffold for SEU offline abstraction.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  drift: ^2.20.3
  flutter_dotenv: ^5.1.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  local_auth: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3: ^2.4.7
  sqlcipher_flutter_libs: ^0.6.4
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
